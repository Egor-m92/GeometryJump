<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doodle Jump — Phaser 3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    touch-action: none;
    -webkit-touch-callout: none;
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const GAME_W = 400;
const GAME_H = 600;
const JUMP_VELOCITY = -900;
const CELL_SIZE = 20;
const SWIPE_THRESHOLD = 30; // минимальная дистанция для свайпа

const config = {
  type: Phaser.AUTO,
  width: GAME_W,
  height: GAME_H,
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 1000 }, debug: false }
  },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: GAME_W,
    height: GAME_H
  },
  input: {
    activePointers: 1
  },
  scene: { preload, create, update }
};

let player, platforms, cursors, wasd;
let scoreText, score = 0, highestY = 0;
let gameOver = false;
let cameraY = 0;

// === МОБИЛЬНОЕ УПРАВЛЕНИЕ ===
let touchDirection = 0;
let tiltDirection = 0;
let isTouching = false;
let swipeStartX = 0;
let swipeDirection = 0;
let isSwiping = false;

let notebookBg;

new Phaser.Game(config);

function preload() {
  const cellG = this.make.graphics();
  cellG.fillStyle(0xf5f8ff, 1);
  cellG.fillRect(0, 0, CELL_SIZE, CELL_SIZE);
  cellG.lineStyle(1, 0x7fb3e0, 0.7);
  cellG.strokeLineShape(new Phaser.Geom.Line(0, CELL_SIZE, CELL_SIZE, CELL_SIZE));
  cellG.strokeLineShape(new Phaser.Geom.Line(CELL_SIZE, 0, CELL_SIZE, CELL_SIZE));
  cellG.generateTexture('cell', CELL_SIZE, CELL_SIZE);
  cellG.destroy();

  makeTexture(this, 'player', 40, 40, (g) => {
    g.fillStyle(0x4caf50, 1); g.fillRoundedRect(0, 0, 40, 40, 8);
    g.fillStyle(0xffffff, 1); g.fillRect(8, 10, 8, 8); g.fillRect(24, 10, 8, 8);
    g.fillStyle(0x000000, 1); g.fillRect(10, 12, 4, 4); g.fillRect(26, 12, 4, 4);
  });

  makeTexture(this, 'platform', 70, 15, (g) => {
    g.fillStyle(0x8bc34a, 1); g.fillRoundedRect(0, 0, 70, 15, 4);
  });
  makeTexture(this, 'moving', 70, 15, (g) => {
    g.fillStyle(0x2196f3, 1); g.fillRoundedRect(0, 0, 70, 15, 4);
  });
  makeTexture(this, 'breakable', 70, 15, (g) => {
    g.fillStyle(0xffa726, 1); g.fillRoundedRect(0, 0, 70, 15, 4);
    g.lineStyle(2, 0x5d4037, 1);
    g.strokeLineShape(new Phaser.Geom.Line(10, 5, 30, 12));
    g.strokeLineShape(new Phaser.Geom.Line(40, 3, 60, 10));
  });
}

function makeTexture(scene, key, w, h, draw) {
  const g = scene.make.graphics();
  draw(g);
  g.generateTexture(key, w, h);
  g.destroy();
}

function create() {
  this.input.keyboard.removeAllListeners();

  gameOver = false;
  score = 0;
  highestY = 0;
  cameraY = 0;
  touchDirection = 0;
  tiltDirection = 0;
  isTouching = false;
  swipeDirection = 0;
  isSwiping = false;

  notebookBg = this.add.tileSprite(GAME_W / 2, GAME_H / 2, GAME_W, GAME_H, 'cell');
  notebookBg.setScrollFactor(0);
  notebookBg.setDepth(-10);

  platforms = this.physics.add.staticGroup();
  spawnPlatform(this, GAME_W / 2, GAME_H - 50, 'platform');

  player = this.physics.add.sprite(GAME_W / 2, GAME_H - 100, 'player');
  player.setCollideWorldBounds(false);
  player.setBounce(0);
  player.body.allowGravity = true;
  player.body.setMaxVelocity(500, 1500);
  player.setOrigin(0.5, 1);
  player.setDepth(5);

  highestY = player.y;

  for (let y = GAME_H - 120; y > -GAME_H; y -= 70) {
    spawnRandomPlatform(this, y);
  }

  cursors = this.input.keyboard.createCursorKeys();
  wasd = this.input.keyboard.addKeys('A,D');

  this.physics.add.overlap(player, platforms, handlePlatformCollision, null, this);

  scoreText = this.add.text(10, 10, 'Счёт: 0', {
    fontSize: '20px', fill: '#1a237e', fontFamily: 'Arial', fontStyle: 'bold'
  }).setScrollFactor(0).setDepth(10);

  this.gameOverText = this.add.text(GAME_W / 2, GAME_H / 2, '', {
    fontSize: '32px', fill: '#d32f2f', fontFamily: 'Arial', align: 'center', fontStyle: 'bold'
  }).setOrigin(0.5).setScrollFactor(0).setDepth(10);

  setupTouchControls(this);
  setupTiltControls(this);
}

// === УПРАВЛЕНИЕ СВАЙПОМ И ТАЧЕМ ===
function setupTouchControls(scene) {
  scene.input.on('pointerdown', (pointer) => {
    isTouching = true;
    swipeStartX = pointer.x;
    swipeDirection = 0;
    isSwiping = false;

    // Начальное направление по позиции пальца
    if (pointer.x < GAME_W / 2) touchDirection = -1;
    else touchDirection = 1;
  });

  scene.input.on('pointermove', (pointer) => {
    if (isTouching) {
      const deltaX = pointer.x - swipeStartX;

      // Определяем свайп
      if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
        isSwiping = true;
        swipeDirection = deltaX > 0 ? 1 : -1;
      }

      // Обновляем направление по позиции пальца
      if (!isSwiping) {
        if (pointer.x < GAME_W / 2) touchDirection = -1;
        else touchDirection = 1;
      }
    }
  });

  scene.input.on('pointerup', () => {
    isTouching = false;
    touchDirection = 0;
    swipeDirection = 0;
    isSwiping = false;
  });

  scene.input.on('pointerupoutside', () => {
    isTouching = false;
    touchDirection = 0;
    swipeDirection = 0;
    isSwiping = false;
  });
}

function setupTiltControls(scene) {
  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(response => {
        if (response === 'granted') window.addEventListener('deviceorientation', handleTilt);
      }).catch(console.error);
    } else {
      window.addEventListener('deviceorientation', handleTilt);
    }
  }
}

function handleTilt(event) {
  const gamma = event.gamma;
  if (gamma !== null) {
    if (Math.abs(gamma) > 5) tiltDirection = gamma > 0 ? 1 : -1;
    else tiltDirection = 0;
  }
}

function handlePlatformCollision(p, plat) {
  if (p.body.velocity.y > 0) {
    const playerBottom = p.body.position.y + p.body.height;
    const platTop = plat.body.position.y;

    if (playerBottom >= platTop && playerBottom <= platTop + 15) {
      const type = plat.texture.key;

      if (type === 'breakable') {
        plat.setAlpha(0.5);
        plat.setScale(1, 0.3);
        this.tweens.add({
          targets: plat,
          alpha: 0,
          y: plat.y + 30,
          duration: 200,
          onComplete: () => plat.destroy()
        });
        return;
      }

      p.body.setVelocityY(JUMP_VELOCITY);

      this.tweens.killTweensOf(p);
      p.setScale(1.3, 0.7);
      this.tweens.add({
        targets: p,
        scaleX: 0.8,
        scaleY: 1.2,
        duration: 120,
        yoyo: true,
        onComplete: () => p.setScale(1, 1)
      });
    }
  }
}

function spawnPlatform(scene, x, y, key = 'platform') {
  const p = platforms.create(x, y, key);
  p.refreshBody();
  p.setDepth(0);

  if (key === 'moving') {
    p.setData('dir', Math.random() < 0.5 ? -1 : 1);
    p.setData('speed', 60 + Math.random() * 60);
  }
  return p;
}

function spawnRandomPlatform(scene, y) {
  const r = Math.random();
  let key = 'platform';
  if (r < 0.15) key = 'breakable';
  else if (r < 0.3) key = 'moving';
  const x = Phaser.Math.Between(40, GAME_W - 40);
  spawnPlatform(scene, x, y, key);
}

function update() {
  if (gameOver) return;

  // === ПРИОРИТЕТ УПРАВЛЕНИЯ: свайп > тач > наклон > клавиатура ===
  let moveDir = 0;

  if (isSwiping && swipeDirection !== 0) {
    moveDir = swipeDirection;
  } else if (isTouching && touchDirection !== 0) {
    moveDir = touchDirection;
  } else if (tiltDirection !== 0) {
    moveDir = tiltDirection;
  } else if (cursors.left.isDown || wasd.A.isDown) {
    moveDir = -1;
  } else if (cursors.right.isDown || wasd.D.isDown) {
    moveDir = 1;
  }

  player.body.setVelocityX(moveDir * 250);

  if (player.x < -20) player.x = GAME_W + 20;
  else if (player.x > GAME_W + 20) player.x = -20;

  platforms.getChildren().forEach(p => {
    if (p.texture.key === 'moving') {
      p.x += p.getData('dir') * p.getData('speed') * 0.016;
      if (p.x < 35 || p.x > GAME_W - 35) p.setData('dir', -p.getData('dir'));
      p.refreshBody();
    }
  });

  if (player.y < highestY) highestY = player.y;

  const playerScreenY = player.y - cameraY;
  const threshold = GAME_H * 0.4;
  if (playerScreenY < threshold) {
    cameraY = player.y - threshold;
  }
  this.cameras.main.setScroll(0, cameraY);

  notebookBg.tilePositionY = cameraY;

  score = Math.max(0, Math.floor((GAME_H - highestY) / 10));
  scoreText.setText('Счёт: ' + score);

  platforms.getChildren().forEach(p => {
    if (p.y > cameraY + GAME_H + 100) p.destroy();
  });

  let topPlatY = cameraY;
  platforms.getChildren().forEach(p => {
    if (p.y < topPlatY) topPlatY = p.y;
  });
  while (topPlatY > cameraY - 200) {
    topPlatY -= Phaser.Math.Between(55, 85);
    spawnRandomPlatform(this, topPlatY);
  }

  if (player.y > cameraY + GAME_H + 50) {
    gameOver = true;
    this.gameOverText.setText('GAME OVER\nСчёт: ' + score + '\nНажми R или тапни');

    this.input.keyboard.once('keydown-R', () => this.scene.restart());
    this.input.once('pointerdown', () => this.scene.restart());
  }
}
</script>
</body>
</html>
